services:
  # Next.js 应用
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Ollama 在本地电脑。本地测试用 host.docker.internal；阶段1 配好 frp 后改为穿透地址，如 https://ollama.chensuipian02004.icu
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_MODEL=qwen2.5:7b
      - EMBEDDING_MODEL=bge-m3
      - CHROMA_ENDPOINT=http://chroma:8000
      # /admin 访问密码，从根目录 .env 读取（与 deploy/docker-compose.server.yml 保持一致）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped

  # Chroma 向量数据库（SQLite 持久化，仅内网访问，不暴露宿主机端口）
  chroma:
    # 固定到 0.5.23：chromadb/chroma:latest 已升级为 v1 服务端（仅 /api/v2），
    # npm chromadb 客户端走 v1 API，用 0.5.23 保持兼容
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  chroma-data:
