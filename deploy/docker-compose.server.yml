services:
  # Next.js 应用
  web:
    image: personal-site:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      # Ollama 在家里电脑上，通过 frps 内网穿透暴露到 frps:11435
      - OLLAMA_BASE_URL=http://frps:11435
      - LLM_MODEL=qwen2.5:7b
      - EMBEDDING_MODEL=bge-m3
      - CHROMA_ENDPOINT=http://chroma:8000
      # /admin 访问密码（本地 .env 里也要配成一样的）
      - ADMIN_PASSWORD=cUIdoghIIFPH0jvmjwiE
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped

  # Chroma 向量数据库（SQLite 持久化）
  chroma:
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # frp 服务端：家里 Mac 的 frpc 主动连过来，把 Ollama 隧道暴露成 frps:11435
  frps:
    image: snowdreamtech/frps:latest
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    ports:
      - "7000:7000"
    restart: unless-stopped

volumes:
  chroma-data:
